name: Build project

on:
  push:
    branches:
      - gh-pages

jobs:
  set-env:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup environment
        run: echo "VITE_BREVO_API_KEY=${{ secrets.VITE_BREVO_API_KEY }}" > .env
